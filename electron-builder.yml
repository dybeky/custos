appId: com.custos.app
productName: Custos
directories:
  output: release
  buildResources: resources

compression: maximum
npmRebuild: true

# Electron fuses, flipped in the binary at package time. Custos runs elevated
# on someone else's PC, so the exe must not double as a Node runtime or a
# debugger target, and must only ever run its own integrity-checked app.asar.
# grantFileProtocolExtraPrivileges stays on: the renderer loads from file://.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true

electronLanguages:
  - en

files:
  - out/**/*
  - resources/**/*
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.txt"
  - "!node_modules/**/test/**"
  - "!node_modules/**/docs/**"

win:
  target:
    - target: portable
      arch:
        - x64
        - arm64
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator
  signAndEditExecutable: false

portable:
  artifactName: custos-${arch}.exe
  requestExecutionLevel: admin

extraResources:
  - from: resources
    to: resources
