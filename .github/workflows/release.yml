name: Release
# Push a version tag (e.g. `git tag 3.0.1 && git push origin 3.0.1`) to build
# both Windows exes and publish them as a GitHub release. The in-app updater
# reads /releases/latest, picks custos-<arch>.exe and checks it against the
# SHA-256 digest GitHub records for every uploaded asset.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
      - run: npm ci
      # Electron 42 downloads its binary on first import; parallel test workers
      # racing to do that occasionally failed CI. Fetch it once, up front.
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  package:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # npm only installs the host (x64) koffi binary; the arm64 exe needs its own.
      - run: node scripts/fetch-koffi-arm64.js
      - run: npx electron-builder --win --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: custos-${{ matrix.arch }}
          path: release/custos-${{ matrix.arch }}.exe
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Release notes = this version's section of CHANGELOG.md (the app shows
      # them in its update dialog); GitHub's generated notes if there is none.
      - name: Extract release notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          echo "--- notes for $ver ---"; cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          # A re-pushed tag (a release rebuilt from a later commit) replaces
          # the release it left behind instead of failing on the duplicate.
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" dist/custos-x64.exe dist/custos-arm64.exe \
            --repo "$GITHUB_REPOSITORY" --title "Custos $GITHUB_REF_NAME" "${notes[@]}" --latest
