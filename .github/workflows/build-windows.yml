name: Build Windows .exe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # npm only installs the host (x64) koffi binary; the arm64 exe needs its own.
      - run: node scripts/fetch-koffi-arm64.js
      - run: npx electron-builder --win --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: custos-windows-${{ matrix.arch }}
          path: release/custos-${{ matrix.arch }}.exe
          if-no-files-found: error
