name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron 42 downloads its binary on first import; parallel test workers
      # racing to do that occasionally failed CI. Fetch it once, up front.
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
