<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- img-src blob: is required: the avatar cropper shows the picked file through URL.createObjectURL ('self' does not cover blob: URLs). -->
    <!-- style-src 'unsafe-inline' is required: the UI relies on React inline style={{...}} attributes (dynamic accent colors, animation delays, gradients) across many components. Removing it would break styling under CSP. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'" />
    <title>Custos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
